<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Civic Routes</title>
  <style>
    :root{--bg:#F4FBF7;--card:#fff;--ink:#0B4F37;--text:#374151;--muted:#6b7c73;--line:#dce9e2;--cta:#00a99d;--soft:#e9f8f2;--red:#EF4444;--shadow:0 8px 24px rgba(11,79,55,.08);--fs:100%}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);font-size:var(--fs)}body.high{--bg:#fff;--card:#fff;--ink:#003b28;--text:#111827;--muted:#374151;--line:#6b7280;--soft:#e5f4ec}body.motion *{transition:none!important;animation:none!important}.app{min-height:100vh;display:grid;place-items:center;padding:18px}.phone{width:min(430px,100%);height:min(920px,calc(100vh - 36px));background:var(--card);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}.top{padding:20px 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.brand h1{margin:0;color:var(--ink);font-size:24px}.brand p{margin:4px 0 0;font-size:12px;color:var(--muted)}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:800}.screen{overflow:auto;padding:18px}.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#fff}.nav button{border:0;background:#fff;color:var(--muted);padding:12px 4px;font-weight:800;font-size:12px}.nav button.active{color:var(--ink);background:var(--soft)}h2{color:var(--ink);font-size:20px;margin:0 0 12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}.card h3{margin:0 0 6px;color:var(--ink);font-size:17px}.meta{font-size:13px;color:var(--muted);line-height:1.45}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 10px;color:var(--ink);font-weight:750;font-size:12px}.chip.sel,.btn{background:var(--cta);color:white;border-color:var(--cta)}.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:900;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.ghost{background:#f3f6f5;color:#52635b}.row{display:flex;gap:8px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--ink);font-weight:900;margin:10px 0 5px}.input,.select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;color:var(--text)}.map{height:440px;border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative;background:#dff0e8;margin-bottom:14px}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(11,79,55,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(11,79,55,.08) 1px,transparent 1px);background-size:58px 58px}.water{position:absolute;left:-5%;right:-5%;top:56%;height:20%;background:#9bd2df;clip-path:polygon(0 35%,22% 0,45% 38%,66% 8%,100% 40%,100% 100%,0 100%)}.road{position:absolute;height:8px;background:#fff;border-radius:999px;opacity:.8}.r1{left:8%;top:33%;width:78%;transform:rotate(-12deg)}.r2{left:19%;top:76%;width:65%;transform:rotate(9deg)}.r3{left:54%;top:5%;width:8px;height:88%;transform:rotate(13deg)}.pin{position:absolute;transform:translate(-50%,-100%);border:3px solid white;border-radius:20px;background:var(--cta);color:white;font-weight:900;padding:9px 11px;box-shadow:0 8px 20px rgba(0,0,0,.18);cursor:pointer}.pin.full{background:#9ca3af;text-decoration:line-through}.bar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px;position:relative}.suggest{position:absolute;top:48px;left:0;right:80px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.suggest button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:12px;color:var(--text)}.suggest button:hover{background:var(--soft)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;place-items:center;padding:18px;z-index:20}.modal.on{display:grid}.modal .box{width:min(430px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:18px}.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status button{border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px;font-weight:800;color:var(--ink)}.status button.sel{background:var(--cta);color:white}.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;margin:9px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.metric b{display:block;color:var(--ink);font-size:24px}.hidden{display:none!important}.login{display:grid;gap:10px}.notice{border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:12px;color:var(--muted);font-size:13px;line-height:1.45}.mapHead{display:flex;justify-content:space-between;margin:0 0 10px}.small{font-size:12px;color:var(--muted)}a{color:var(--cta)}
  </style>
</head>
<body>
<div class="app"><div class="phone">
  <header class="top"><div class="brand"><h1>Civic Routes</h1><p id="sub">Low-pressure local activities in Rotterdam</p></div><span class="pill" id="rolePill">Guest</span></header>
  <main class="screen" id="screen"></main>
  <nav class="nav"><button data-tab="events">Events</button><button data-tab="map">Map</button><button data-tab="settings">Settings</button><button data-tab="organiser">Organiser</button></nav>
</div></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script>
const $=s=>document.querySelector(s);const screen=$('#screen'),modal=$('#modal'),box=$('#modalBox');
const locs={Kralingen:[58,34],Centrum:[43,42],Noord:[35,28],Delfshaven:[26,58],Zuid:[55,72],Crooswijk:[48,26]};
let state=JSON.parse(localStorage.civicState||'{}');state={tab:'login',role:null,userId:state.userId||('CR-'+Math.random().toString(36).slice(2,8).toUpperCase()),zone:state.zone||'Kralingen',radius:state.radius||5,hobbies:state.hobbies||['Sports','Reading'],statuses:state.statuses||{},bring:state.bring||{},pause:state.pause||false,hide:state.hide||false,fs:state.fs||100,...state};
const events=[{id:'e1',title:'Beginner 3v3 Basketball Run',cat:'Sports',zone:'Kralingen',x:58,y:38,time:'Today 18:30',loc:'Schouwburgplein Court',coords:'51.9225,4.4869',max:12,cur:6,skill:'Beginner',host:true,alone:true,reason:'sports, beginner level, evenings and within your selected radius'},{id:'e2',title:'Quiet Reading Circle',cat:'Reading',zone:'Centrum',x:43,y:43,time:'Sat 11:00',loc:'Library Blaak',coords:'51.9201,4.4898',max:10,cur:3,skill:'Calm',host:true,alone:true,reason:'reading, quiet activities and small groups'},{id:'e3',title:'Community Dinner Table',cat:'Cooking',zone:'Delfshaven',x:26,y:58,time:'Tomorrow 19:00',loc:'Delfshaven Community Kitchen',coords:'51.9102,4.4471',max:16,cur:13,skill:'All levels',host:true,alone:true,reason:'cooking and low-pressure structured events'},{id:'e4',title:'Board Game Night',cat:'Gaming',zone:'Noord',x:35,y:28,time:'Fri 20:00',loc:'Noord Community Centre',coords:'51.9358,4.4782',max:20,cur:20,skill:'Beginner',host:true,alone:false,reason:'board games and weekend events'},{id:'e5',title:'Walking Group by the Lake',cat:'Walking',zone:'Kralingen',x:64,y:31,time:'Sun 10:00',loc:'Kralingse Plas',coords:'51.9344,4.5261',max:18,cur:7,skill:'Easy',host:true,alone:true,reason:'walking and nearby outdoor events'}];
function save(){localStorage.civicState=JSON.stringify(state);document.body.style.setProperty('--fs',state.fs+'%');document.body.classList.toggle('motion',!!state.reduce);document.body.classList.toggle('high',!!state.high);$('#rolePill').textContent=state.role?state.role[0].toUpperCase()+state.role.slice(1)+' · '+state.userId:'Guest'}
function distance(a){return a.zone===state.zone?1:({Centrum:3,Kralingen:3,Noord:5,Delfshaven:8,Zuid:10,Crooswijk:4}[a.zone]||6)}
function filtered(){return events.filter(e=>distance(e)<=state.radius).sort((a,b)=>(state.hobbies.includes(b.cat)-state.hobbies.includes(a.cat))||(a.cur/a.max-b.cur/b.max))}
function nav(t){state.tab=t;save();render()}function open(html){box.innerHTML=html;modal.classList.add('on')}modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')}
function card(e){let full=e.cur>=e.max,st=state.statuses[e.id];return `<div class="card"><h3>${e.title}</h3><p class="meta">${e.time} · <a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.coords)}">${e.loc}</a> · ${e.max-e.cur} open spots</p><div class="chips"><span class="chip">${e.cat}</span><span class="chip">${e.skill}</span><span class="chip">Verified organiser</span>${e.alone?'<span class="chip">People come alone</span>':''}</div><p class="small">${state.pause?'Recommendations are paused. You can still search manually.':'Recommended because you selected '+e.reason+'.'}</p><div class="row"><button class="btn secondary" onclick="details('${e.id}')">Learn More</button><button class="btn" ${full?'disabled':''} onclick="join('${e.id}')">${full?'Full':st||'Join'}</button></div></div>`}
function login(){screen.innerHTML=`<h2>Choose demo mode</h2><div class="notice">This prototype uses a mock user ID so residents and organisers can be separated without public profiles or public attendee lists.</div><div class="login"><button class="btn" onclick="state.role='resident';state.tab='map';save();render()">Continue as resident</button><button class="btn secondary" onclick="state.role='organiser';state.tab='organiser';save();render()">Sign up as verified organiser</button></div>`}
function map(){let fs=filtered();screen.innerHTML=`<div class="mapHead"><div><h2>Map</h2><p class="small">${state.zone} · radius ${state.radius} km · pins only</p></div><button class="btn secondary" onclick="state.tab='events';render()">Events</button></div><div class="bar"><input class="input" id="search" placeholder="Search Kralingen, Centrum, basketball..." oninput="suggest(this.value)"><select class="select" onchange="state.radius=+this.value;save();render()"><option ${state.radius==1?'selected':''}>1</option><option ${state.radius==2?'selected':''}>2</option><option ${state.radius==5?'selected':''}>5</option><option ${state.radius==10?'selected':''}>10</option><option ${state.radius==20?'selected':''}>20</option></select><div id="suggest" class="suggest hidden"></div></div><div class="map"><div class="water"></div><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div>${Object.keys(locs).map(z=>`<span class="small" style="position:absolute;left:${locs[z][0]-5}%;top:${locs[z][1]-8}%">${z}</span>`).join('')}${fs.map(e=>`<button class="pin ${e.cur>=e.max?'full':''}" style="left:${e.x}%;top:${e.y}%" onclick="details('${e.id}')">${e.cat[0]}</button>`).join('')}</div><h2>Nearby activities</h2>${fs.map(card).join('')}`}
function suggest(q){let d=$('#suggest');if(!q){d.classList.add('hidden');return}let hits=[...Object.keys(locs),'Basketball','Reading','Cooking','Walking','Gaming'].filter(x=>x.toLowerCase().includes(q.toLowerCase()));d.innerHTML=hits.map(h=>`<button onclick="pick('${h}')">${h}</button>`).join('');d.classList.toggle('hidden',!hits.length)}
function pick(x){if(locs[x])state.zone=x;else if(!state.hobbies.includes(x))state.hobbies.push(x);save();render()}
function details(id){let e=events.find(x=>x.id===id),st=state.statuses[id]||'None';open(`<h2>${e.title}</h2><p class="meta">${e.time} · <a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.coords)}">${e.loc}</a></p><div class="chips"><span class="chip">${e.cat}</span><span class="chip">${e.skill}</span><span class="chip">${e.max-e.cur} open spots</span><span class="chip">Welcome host</span></div><p>${state.pause?'Recommendations are paused. You can still search events manually.':'Recommended because you selected '+e.reason+'.'}</p><h3>Participation</h3><div class="status">${['Spectator','Join','Interested','Maybe','Remind me later'].map(s=>`<button class="${st==s?'sel':''}" onclick="setStatus('${id}','${s}')">${s}</button>`).join('')}<button class="${state.bring[id]?'sel':''}" onclick="state.bring['${id}']=!state.bring['${id}'];save();details('${id}')">Bring a friend</button></div><div class="row" style="margin-top:14px"><button class="btn secondary" onclick="modal.classList.remove('on')">Back to events</button><button class="btn" onclick="arrival('${id}')">Arrival Companion</button></div>`)}
function setStatus(id,s){state.statuses[id]=s;save();details(id)}function join(id){setStatus(id,'Join');arrival(id)}
function arrival(id){let e=events.find(x=>x.id===id);open(`<h2>Arrival Companion</h2><p class="meta">${e.title}</p><div class="card"><p><b>Exact location:</b> ${e.loc}</p><p><b>Coordinates:</b> ${e.coords}</p><p><b>Bring:</b> Water bottle and comfortable shoes.</p><p><b>First 10 minutes:</b> find the turquoise welcome sign, meet the host, warm up casually, teams are assigned automatically.</p><button class="btn" onclick="alert('Host notified in prototype')">I'm here</button></div><h3>Team placement preview</h3><div class="card">Team A: You + 2 others<br>Team B: 3 participants<br>Team C: 3 participants</div>`)}
function eventsTab(){let fs=filtered();screen.innerHTML=`<h2>Events</h2><input class="input" placeholder="Search location or hobby" oninput="state.q=this.value;render()"><p class="small">Recommended events are sorted by relevance, distance, availability and timing. All available events remain reachable.</p>${state.pause?'<div class="notice">Recommendations are paused. You can still search events manually.</div>':''}${fs.map(card).join('')}`}
function settings(){let hs=['Sports','Reading','Music','Gaming','Cooking','Walking','Literature','Board Games','Arts & Crafts'];screen.innerHTML=`<h2>Settings</h2><div class="card"><h3>Hobby Preferences</h3><p class="meta">Update the activities used for recommendations.</p><div class="chips">${hs.map(h=>`<button class="chip ${state.hobbies.includes(h)?'sel':''}" onclick="toggleHobby('${h}')">${h}</button>`).join('')}</div></div><div class="card"><h3>Accessibility</h3><label class="toggle">Reduce motion <input type="checkbox" ${state.reduce?'checked':''} onchange="state.reduce=this.checked;save()"></label><label class="toggle">High contrast <input type="checkbox" ${state.high?'checked':''} onchange="state.high=this.checked;save()"></label><label class="toggle">Colorblind theme labels <input type="checkbox" ${state.color?'checked':''} onchange="state.color=this.checked;save()"></label><label>Font size: <span id="fs">${state.fs}%</span></label><input class="input" type="range" min="100" max="140" step="10" value="${state.fs}" oninput="state.fs=this.value;save();$('#fs').textContent=this.value+'%'" /></div><div class="card"><h3>Privacy controls</h3><label class="toggle">Pause recommendations <input type="checkbox" ${state.pause?'checked':''} onchange="state.pause=this.checked;save();render()"></label><label class="toggle">Hide me from matching <input type="checkbox" ${state.hide?'checked':''} onchange="state.hide=this.checked;save();render()"></label><button class="btn ghost" onclick="deleteData()">Delete my data</button><p class="small">You control what the app uses. Municipality dashboards only receive anonymous aggregate counts.</p></div>`}
function toggleHobby(h){state.hobbies=state.hobbies.includes(h)?state.hobbies.filter(x=>x!==h):[...state.hobbies,h];save();settings()}function deleteData(){if(confirm('Delete your data? This removes profile, preferences, saved events, joins and recommendation history from this prototype.')){localStorage.removeItem('civicState');location.reload()}}
function organiser(){screen.innerHTML=`<h2>Organiser Hub</h2><div class="notice">Signing up as organiser creates a verified organiser demo account. Residents cannot create public events.</div><div class="card"><h3>Create event</h3><div class="field"><label>Title</label><input class="input" id="ot" value="Beginner futsal night"></div><div class="field"><label>Requirements</label><select class="select"><option>Beginner friendly</option><option>Welcome host required</option><option>Age 18+</option></select></div><button class="btn" onclick="alert('Demo event created and visible to eligible residents')">Create demo event</button></div><div class="card"><h3>AI Event Proposal</h3><p class="meta">14 nearby users selected basketball in Kralingen. Weather is clear. Suggested time: 18:30.</p><div class="row"><button class="btn">Approve</button><button class="btn secondary">Edit</button><button class="btn ghost">Reject</button></div></div><h2>Municipality dashboard</h2><div class="metrics"><div class="metric"><b>42</b><span>events this month</span></div><div class="metric"><b>318</b><span>attendances</span></div><div class="metric"><b>37%</b><span>first-time participants</span></div><div class="metric"><b>0</b><span>individual profiles visible</span></div></div>`}
function render(){save();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));if(!state.role)return login();({map,events:eventsTab,settings,organiser,login}[state.tab]||map)()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>state.role?nav(b.dataset.tab):login());render();
</script>
</body>
</html>
