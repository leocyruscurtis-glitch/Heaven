<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haven</title>
    <script src="/env.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      :root {
        color-scheme: light;
        --mint: #f2fbf7;
        --mint-2: #e9f7ef;
        --card: #ffffff;
        --ink: #0b4228;
        --text: #333333;
        --muted: #66766d;
        --line: #d8e5dd;
        --accent: #00d2c4;
        --accent-dark: #08796f;
        --danger: #9d2f2f;
        --warning: #8a4b05;
        --shadow: 0 8px 24px rgba(11, 79, 55, 0.06);
        --font-scale: 1;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html { background: var(--mint); }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: radial-gradient(circle at top, rgba(0, 210, 196, 0.12), transparent 38%), var(--mint);
        font-size: calc(16px * var(--font-scale));
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.52; }
      a { color: var(--accent-dark); }

      body.high-contrast {
        --mint: #ffffff;
        --mint-2: #e2f4ed;
        --line: #789285;
        --muted: #27362f;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      }
      body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after {
        transition: none !important;
        animation: none !important;
      }

      .app-root {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 18px;
      }
      .phone {
        position: relative;
        width: min(100%, 460px);
        min-height: calc(100vh - 36px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 30px;
        background: var(--mint);
        box-shadow: 0 18px 70px rgba(10, 79, 59, 0.14);
      }
      .phone.no-frame {
        width: min(100%, 900px);
      }
      .screen {
        min-height: calc(100vh - 36px);
        padding: 24px 18px 104px;
      }
      .screen.auth-screen, .screen.setup-screen { padding-bottom: 24px; }

      .brand-row, .top-row, .split {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand-row { margin-bottom: 24px; }
      .brand-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .brand-name { margin: 0; color: var(--ink); font-size: 1.45rem; line-height: 1; }
      .eyebrow {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      h1, h2, h3, p { margin-top: 0; }
      h1 { color: var(--ink); font-size: 2.3rem; line-height: 0.98; letter-spacing: -0.055em; margin-bottom: 12px; }
      h2 { color: var(--ink); font-size: 1.7rem; line-height: 1.1; margin-bottom: 10px; letter-spacing: -0.035em; }
      h3 { color: var(--ink); font-size: 1.08rem; margin-bottom: 8px; }
      .muted { color: var(--muted); }
      .small { font-size: 0.88rem; }

      .stack { display: grid; gap: 14px; }
      .grid { display: grid; gap: 12px; }
      .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .card, .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 16px;
        box-shadow: var(--shadow);
      }
      .panel.flat { box-shadow: none; }
      .hero-card {
        min-height: calc(100vh - 84px);
        display: grid;
        align-content: center;
        gap: 22px;
      }

      .field { display: grid; gap: 7px; }
      .field label, .legend { color: var(--muted); font-size: 0.82rem; font-weight: 800; }
      input, select, textarea {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #ffffff;
        color: var(--text);
        padding: 11px 13px;
        outline: none;
      }
      textarea { min-height: 104px; resize: vertical; }
      input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 210, 196, 0.18); }

      .pill-row, .btn-row { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
      .choice { position: relative; }
      .choice input { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
      .choice span, .chip, .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #ffffff;
        color: var(--ink);
        padding: 7px 11px;
        font-size: 0.86rem;
        font-weight: 800;
      }
      .choice input:checked + span, .chip.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }
      .badge.soft { background: var(--mint-2); color: var(--ink); border-color: transparent; }
      .badge.warning { background: #fff1d8; color: var(--warning); border-color: transparent; }
      .badge.full { background: #eef0ef; color: #5d6862; border-color: transparent; }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 11px 15px;
        border: 1px solid var(--accent-dark);
        border-radius: 15px;
        background: var(--accent-dark);
        color: #ffffff;
        font-weight: 900;
        text-decoration: none;
      }
      .button.primary { background: var(--accent); border-color: var(--accent); color: #063d32; }
      .button.secondary { background: #ffffff; color: var(--ink); border-color: var(--line); }
      .button.ghost { background: transparent; color: var(--ink); border-color: transparent; }
      .button.danger { background: #fff4f4; color: var(--danger); border-color: #e8b7b7; }
      .full-width { width: 100%; }

      .bottom-nav {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: repeat(var(--nav-count), 1fr);
        gap: 7px;
        min-height: 78px;
        padding: 9px 12px 12px;
        border-top: 1px solid var(--line);
        border-radius: 22px 22px 0 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(18px);
        box-shadow: 0 -10px 34px rgba(14, 45, 34, 0.08);
      }
      .tab-button {
        display: grid;
        place-items: center;
        gap: 4px;
        min-height: 56px;
        border: 0;
        border-radius: 18px;
        background: transparent;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 900;
      }
      .tab-button .tab-icon { font-size: 1.22rem; line-height: 1; }
      .tab-button.active { background: var(--mint-2); color: var(--accent-dark); }

      .event-list { display: grid; gap: 14px; }
      .event-card { display: grid; gap: 12px; }
      .event-title-row { display: flex; align-items: flex-start; gap: 12px; }
      .event-icon {
        flex: 0 0 auto;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--mint-2);
        color: var(--ink);
        font-weight: 900;
      }
      .event-card h3 { font-size: 1.28rem; margin: 0 0 4px; }
      .event-meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 7px; font-size: 0.92rem; }
      .capacity { font-weight: 900; color: var(--ink); }

      .map-shell { display: grid; gap: 14px; }
      #map {
        height: min(58vh, 460px);
        min-height: 360px;
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        background: #dbe8e0;
        box-shadow: var(--shadow);
      }
      .leaflet-container { font: inherit; }
      .event-pin { width: 28px; height: 36px; transform: translate(-14px, -36px); }
      .event-pin span { display: block; width: 28px; height: 28px; border: 3px solid #fff; border-radius: 50% 50% 50% 5px; transform: rotate(-45deg); box-shadow: 0 8px 18px rgba(0,0,0,.22); }
      .pin-active span { background: var(--accent); }
      .pin-full span { background: #7c8781; }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: end center;
        padding: 18px;
        background: rgba(8, 25, 19, 0.42);
      }
      .modal {
        width: min(100%, 460px);
        max-height: 92vh;
        overflow: auto;
        border-radius: 26px;
        background: #ffffff;
        box-shadow: 0 22px 80px rgba(0, 0, 0, 0.25);
      }
      .modal-header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .modal-body { padding: 18px; }

      .notice, .error-box {
        border-radius: 16px;
        padding: 13px 14px;
      }
      .notice { border: 1px solid #bcded0; background: var(--mint-2); color: var(--ink); }
      .error-box { border: 1px solid #e8b7b7; background: #fff4f4; color: var(--danger); }
      .empty { min-height: 180px; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 20px; color: var(--muted); text-align: center; padding: 18px; }
      .toast { position: fixed; left: 50%; bottom: 22px; z-index: 1400; width: min(420px, calc(100vw - 32px)); transform: translate(-50%, 20px); opacity: 0; border-radius: 16px; background: var(--ink); color: #fff; padding: 14px 16px; box-shadow: var(--shadow); transition: opacity .16s ease, transform .16s ease; }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      .hidden { display: none !important; }

      @media (max-width: 540px) {
        .app-root { padding: 0; }
        .phone { min-height: 100vh; border: 0; border-radius: 0; }
        .screen { min-height: 100vh; }
        .grid.two, .grid.three { grid-template-columns: 1fr; }
        h1 { font-size: 2.1rem; }
      }
    </style>
  </head>
  <body>
    <main id="app" class="app-root"><section class="phone"><div class="screen"><div class="empty">Loading Haven...</div></div></section></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module">
      const MISSING_ENV_MESSAGE = "Supabase environment variables are missing. Add VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY in Vercel.";
      const ACTIVE_EVENT_STATUSES = ["open", "scheduled", "live", "minimum_reached", "almost_full", "full"];
      const MAIN_STATES = ["Join", "Interested", "Maybe", "Remind me later", "Spectator"];
      const AGE_RANGES = ["18–25", "25–35", "35–45", "45–60", "60+"];
      const GENDERS = ["None", "Male", "Female"];
      const INTERESTS = ["Sports", "Board Games", "Literature", "Music", "Dance", "Gaming", "Cooking", "Walking"];
      const NOTIFICATIONS = ["nearby", "recommended", "startingSoon", "quiet", "team", "weekend"];
      const ZONES = {
        kralingen: { name: "Kralingen", lat: 51.9225, lng: 4.5325 },
        centrum: { name: "Centrum", lat: 51.9225, lng: 4.4792 },
        noord: { name: "Noord", lat: 51.9395, lng: 4.4797 },
        west: { name: "West", lat: 51.9165, lng: 4.4523 },
        zuid: { name: "Zuid", lat: 51.895, lng: 4.506 },
        delfshaven: { name: "Delfshaven", lat: 51.909, lng: 4.448 },
        crooswijk: { name: "Crooswijk", lat: 51.928, lng: 4.504 },
      };

      const app = document.querySelector("#app");
      const state = {
        supabase: null,
        configError: "",
        session: null,
        user: null,
        role: "",
        resident: null,
        organiser: null,
        tab: "map",
        authMode: "signin",
        authRole: "resident",
        notice: "",
        error: "",
        events: [],
        registrations: [],
        selectedEventId: "",
        detailDraft: null,
        countDialog: null,
        deleteConfirm: false,
        settingsEditInterests: false,
        savingRegistration: false,
        filters: { zone: "", radius: "", query: "" },
      };
      let mapInstance = null;
      let markerLayer = null;
      let radiusLayer = null;

      function escapeHtml(value) {
        return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      }
      function asArray(value) {
        if (Array.isArray(value)) return value;
        if (!value) return [];
        if (typeof value === "string") { try { const parsed = JSON.parse(value); return Array.isArray(parsed) ? parsed : []; } catch { return []; } }
        return [];
      }
      function asObject(value, fallback = {}) {
        if (!value) return { ...fallback };
        if (typeof value === "object" && !Array.isArray(value)) return { ...fallback, ...value };
        if (typeof value === "string") { try { const parsed = JSON.parse(value); return parsed && typeof parsed === "object" ? { ...fallback, ...parsed } : { ...fallback }; } catch { return { ...fallback }; } }
        return { ...fallback };
      }
      function defaultNotificationPrefs() { return { nearby: true, recommended: true, startingSoon: true, quiet: false, team: true, weekend: true }; }
      function defaultPrivacySettings() { return { pauseRecs: false, hideFromMatching: false, deactivated: false }; }
      function defaultAccessibilityPrefs() { return { fontScale: 1, reducedMotion: false, highContrast: false, colorblind: false }; }
      function getZoneId() { return state.filters.zone || state.resident?.location_zone_id || state.organiser?.municipality_zone_id || "kralingen"; }
      function getRadiusKm() { return Number(state.filters.radius || state.resident?.radius_km || 5); }
      function getZone(zoneId = getZoneId()) { return ZONES[zoneId] || ZONES.kralingen; }
      function formatTime(value) { if (!value) return "Time to be confirmed"; const date = new Date(value); if (Number.isNaN(date.getTime())) return value; return date.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
      function dateTimeLocal(minutesAhead) { const date = new Date(Date.now() + minutesAhead * 60 * 1000); date.setMinutes(date.getMinutes() - date.getTimezoneOffset()); return date.toISOString().slice(0, 16); }
      function toast(message) { const node = document.querySelector("#toast"); node.textContent = message; node.classList.add("show"); window.setTimeout(() => node.classList.remove("show"), 3400); }
      function setError(message) { state.error = message || ""; state.notice = ""; render(); }
      function setNotice(message) { state.notice = message || ""; state.error = ""; render(); }
      function haversineKm(aLat, aLng, bLat, bLng) { const toRad = (v) => Number(v) * Math.PI / 180; const earthKm = 6371; const dLat = toRad(bLat - aLat); const dLng = toRad(bLng - aLng); const lat1 = toRad(aLat); const lat2 = toRad(bLat); const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2; return 2 * earthKm * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); }
      function eventDistance(event) { const center = getZone(); return haversineKm(center.lat, center.lng, Number(event.lat), Number(event.lng)); }
      function isFull(event) { return event.status === "full" || Number(event.current_registration || 0) >= Number(event.max_capacity || 0); }
      function spotsLeft(event) { return Math.max(0, Number(event.max_capacity || 0) - Number(event.current_registration || 0)); }
      function statusLabel(event) { if (isFull(event)) return "Full"; const left = spotsLeft(event); if (left <= 3) return "Almost full"; return event.status === "live" ? "Open" : "Scheduled"; }
      function ageValue(ageRange) { return { "18–25": 21, "25–35": 30, "35–45": 40, "45–60": 52, "60+": 65 }[ageRange] || 30; }
      function isEligible(event) {
        if (!state.resident) return true;
        const age = ageValue(state.resident.age_range);
        if (event.age_range_min && age < Number(event.age_range_min)) return false;
        if (event.age_range_max && age > Number(event.age_range_max)) return false;
        const req = event.gender_requirement_optional;
        if (req && req !== "None" && state.resident.gender_optional !== req) return false;
        return true;
      }
      function eventKeywords(event) { return [event.title, event.category, event.subcategory, event.description, event.location_name, event.address].filter(Boolean).join(" ").toLowerCase(); }
      function matchScore(event) {
        const interests = asArray(state.resident?.selected_interests).map((x) => String(x).toLowerCase());
        if (!interests.length) return 0;
        const haystack = eventKeywords(event);
        return interests.reduce((sum, interest) => sum + (haystack.includes(interest) ? 1 : 0), 0);
      }
      function visibleEvents() {
        const q = state.filters.query.trim().toLowerCase();
        const radius = getRadiusKm();
        return [...state.events]
          .filter((e) => ACTIVE_EVENT_STATUSES.includes(e.status || "scheduled"))
          .filter((e) => isEligible(e))
          .filter((e) => e.lat && e.lng && eventDistance(e) <= radius)
          .filter((e) => !q || eventKeywords(e).includes(q))
          .sort((a, b) => {
            const privacy = asObject(state.resident?.privacy_settings, defaultPrivacySettings());
            if (!privacy.hideFromMatching && !privacy.pauseRecs) {
              const score = matchScore(b) - matchScore(a);
              if (score) return score;
            }
            const avail = Number(!isFull(b)) - Number(!isFull(a));
            if (avail) return avail;
            return new Date(a.start_time || 0) - new Date(b.start_time || 0);
          });
      }
      function registrationFor(eventId) { return state.registrations.find((reg) => reg.event_id === eventId); }
      function selectedEvent() { return state.events.find((event) => event.id === state.selectedEventId); }
      function osmLink(event) { const lat = Number(event.lat); const lng = Number(event.lng); return `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=17/${lat}/${lng}`; }
      function eventReason(event) { return event.recommendation_reason || `Recommended because this matches ${event.category || "your interests"}, ${getZone(event.zone_id).name || "your area"}, beginner-friendly format, and open capacity.`; }
      function applyAccessibility() {
        const prefs = asObject(state.resident?.accessibility_preferences, defaultAccessibilityPrefs());
        document.documentElement.style.setProperty("--font-scale", String(prefs.fontScale || 1));
        document.body.classList.toggle("high-contrast", Boolean(prefs.highContrast));
        document.body.classList.toggle("reduced-motion", Boolean(prefs.reducedMotion));
      }

      function render() {
        applyAccessibility();
        if (state.configError) { app.innerHTML = renderMissingEnv(); return; }
        if (!state.session) { app.innerHTML = renderAuth(); return; }
        if (state.role === "resident" && state.resident?.onboarding_complete !== true) { app.innerHTML = renderOnboarding(); return; }
        if (state.role === "organiser") { app.innerHTML = renderOrganiserApp(); return; }
        app.innerHTML = renderResidentApp();
        if (state.tab === "map") window.setTimeout(renderMap, 0); else removeMap();
      }

      function screenShell(content, tabs = []) {
        return `<section class="phone"><div class="screen">${brandHeader()}${messages()}${content}</div>${tabs.length ? bottomNav(tabs) : ""}${renderEventModal()}${renderCountDialog()}${renderDeleteConfirm()}</section>`;
      }
      function brandHeader(title = "Haven") {
        return `<header class="brand-row"><div class="brand-row" style="margin:0"><div class="brand-mark">H</div><div><p class="eyebrow">Haven</p><p class="brand-name">${escapeHtml(title)}</p></div></div>${state.session ? `<button class="button ghost" data-action="signout">Sign out</button>` : ""}</header>`;
      }
      function messages() { return `${state.notice ? `<div class="notice">${escapeHtml(state.notice)}</div>` : ""}${state.error ? `<div class="error-box">${escapeHtml(state.error)}</div>` : ""}`; }
      function bottomNav(items) { return `<nav class="bottom-nav" style="--nav-count:${items.length}">${items.map((item) => `<button class="tab-button ${state.tab === item.id ? "active" : ""}" data-action="tab" data-tab="${item.id}"><span class="tab-icon">${item.icon}</span><span>${escapeHtml(item.label)}</span></button>`).join("")}</nav>`; }
      function renderMissingEnv() { return `<section class="phone"><div class="screen auth-screen hero-card"><div><p class="eyebrow">Haven</p><h1>Connect events to real participation.</h1><p class="muted">This deployment needs its public app configuration before residents or organisers can sign in.</p></div><div class="error-box">${escapeHtml(state.configError)}</div></div></section>`; }

      function renderAuth() {
        const isSignup = state.authMode === "signup";
        return `<section class="phone"><div class="screen auth-screen hero-card"><div><p class="eyebrow">Haven</p><h1>Join nearby activities without awkward messaging.</h1><p class="muted">Residents discover low-pressure events. Verified organisers create structured activities.</p></div>${messages()}<div class="card stack"><div class="btn-row"><button class="button ${!isSignup ? "primary" : "secondary"}" data-action="auth-mode" data-mode="signin">Sign in</button><button class="button ${isSignup ? "primary" : "secondary"}" data-action="auth-mode" data-mode="signup">Create account</button></div><form id="auth-form" class="stack">${isSignup ? `<div class="field"><label for="auth-name">Name</label><input id="auth-name" name="name" autocomplete="name" required /></div><div class="field"><span class="legend">Account type</span><div class="pill-row"><label class="choice"><input type="radio" name="role" value="resident" ${state.authRole === "resident" ? "checked" : ""} /><span>Resident</span></label><label class="choice"><input type="radio" name="role" value="organiser" ${state.authRole === "organiser" ? "checked" : ""} /><span>Organiser</span></label></div></div>` : ""}<div class="field"><label for="auth-email">Email</label><input id="auth-email" name="email" type="email" autocomplete="email" required /></div><div class="field"><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" autocomplete="${isSignup ? "new-password" : "current-password"}" minlength="6" required /></div><button class="button primary full-width" type="submit">${isSignup ? "Create account" : "Sign in"}</button></form></div></div></section>`;
      }

      function renderOnboarding() {
        const r = state.resident || {};
        const selected = asArray(r.selected_interests);
        const notifications = asObject(r.notification_preferences, defaultNotificationPrefs());
        return `<section class="phone"><div class="screen setup-screen">${brandHeader("Setup")}${messages()}<div class="stack"><div><p class="eyebrow">Resident setup</p><h1>A few preferences before the map.</h1><p class="muted">Haven uses only the preferences you choose. No public profiles, ratings, or public attendee lists.</p></div><form id="onboarding-form" class="stack"><div class="card stack"><h3>Profile</h3><div class="grid two"><div class="field"><label>Age range</label><select name="age_range" required>${AGE_RANGES.map((v) => `<option ${r.age_range === v ? "selected" : ""}>${v}</option>`).join("")}</select></div><div class="field"><label>Gender</label><select name="gender_optional" required>${GENDERS.map((v) => `<option ${r.gender_optional === v ? "selected" : ""}>${v}</option>`).join("")}</select></div></div></div><div class="card stack"><h3>Location</h3><div class="grid two"><div class="field"><label>Area</label><select name="location_zone_id" required>${zoneOptions(r.location_zone_id || "kralingen")}</select></div><div class="field"><label>Radius</label><select name="radius_km" required>${[1,2,5,10,20].map((v) => `<option value="${v}" ${Number(r.radius_km || 5) === v ? "selected" : ""}>${v} km</option>`).join("")}</select></div></div></div><div class="card stack"><h3>Interests</h3><div class="pill-row">${checkboxChoices("selected_interests", INTERESTS, selected)}</div></div><div class="card stack"><h3>Notifications</h3><div class="pill-row">${checkboxChoices("notification_preferences", NOTIFICATIONS, Object.keys(notifications).filter((k) => notifications[k]))}</div></div><button class="button primary full-width" type="submit">Continue to Map</button></form></div></div></section>`;
      }

      function renderResidentApp() {
        const tabs = [{ id: "events", label: "Events", icon: "◻" }, { id: "map", label: "Map", icon: "⌖" }, { id: "settings", label: "Settings", icon: "⚙" }];
        const events = visibleEvents();
        const content = state.tab === "settings" ? renderSettings() : state.tab === "map" ? renderMapScreen(events) : renderEvents(events);
        return screenShell(content, tabs);
      }
      function renderOrganiserApp() {
        if (!["dashboard", "create", "my-events"].includes(state.tab)) state.tab = "dashboard";
        const mine = state.events.filter((e) => e.organiser_id === state.organiser?.id);
        const tabs = [{ id: "dashboard", label: "Dashboard", icon: "▣" }, { id: "create", label: "Create", icon: "+" }, { id: "my-events", label: "My Events", icon: "☰" }];
        const content = state.tab === "create" ? renderCreateEvent() : state.tab === "my-events" ? renderMyEvents(mine) : renderOrganiserDashboard(mine);
        return screenShell(content, tabs);
      }

      function renderEvents(events) {
        const privacy = asObject(state.resident?.privacy_settings, defaultPrivacySettings());
        const matching = !privacy.pauseRecs && !privacy.hideFromMatching;
        const recommended = matching ? events.filter((e) => matchScore(e) > 0) : [];
        const fallback = matching ? events.filter((e) => matchScore(e) === 0) : events;
        return `<section class="stack"><div><h1>Events</h1><p class="muted">Tailored to your preferences. Tap to see details.</p></div><form id="filter-form" class="card"><div class="field"><label>Search</label><input name="query" value="${escapeHtml(state.filters.query)}" placeholder="Search location, hobby, or category" /></div></form>${!matching ? `<div class="notice">Recommendations are paused. You can still search events manually.</div>` : ""}<div class="stack"><p class="eyebrow">${recommended.length ? "Recommended for you" : "Other events you might explore"}</p><div class="event-list">${(recommended.length ? recommended : fallback).length ? (recommended.length ? recommended : fallback).map(renderEventCard).join("") : emptyState("No events available in this radius right now.")}</div>${recommended.length && fallback.length ? `<p class="eyebrow">Other events you might explore</p><div class="event-list">${fallback.map(renderEventCard).join("")}</div>` : ""}</div></section>`;
      }
      function renderMapScreen(events) {
        return `<section class="stack"><div><h1>Map</h1><p class="muted">Pins show events inside your selected radius.</p></div>${renderSearchControls()}<div class="map-shell"><div id="map"></div><div class="panel stack"><h3>Nearby events</h3>${events.length ? events.slice(0,5).map(renderCompactEvent).join("") : emptyState("No events inside this radius.")}</div></div></section>`;
      }
      function renderSearchControls() {
        return `<form id="filter-form" class="card stack"><div class="field"><label>Search</label><input name="query" value="${escapeHtml(state.filters.query)}" placeholder="Basketball, books, walking" /></div><div class="grid two"><div class="field"><label>Area</label><select name="zone" data-autosubmit="true">${zoneOptions(getZoneId())}</select></div><div class="field"><label>Radius</label><select name="radius" data-autosubmit="true">${[1,2,5,10,20].map((v) => `<option value="${v}" ${getRadiusKm() === v ? "selected" : ""}>${v} km</option>`).join("")}</select></div></div></form>`;
      }

      function renderSettings() {
        const r = state.resident || {};
        const selected = asArray(r.selected_interests);
        const notifications = asObject(r.notification_preferences, defaultNotificationPrefs());
        const accessibility = asObject(r.accessibility_preferences, defaultAccessibilityPrefs());
        const privacy = asObject(r.privacy_settings, defaultPrivacySettings());
        return `<section class="stack"><div><h1>Settings</h1><p class="muted">You control what Haven uses.</p></div><form id="settings-form" class="stack"><div class="card stack"><h3>Profile</h3><div class="grid two"><div class="field"><label>Age range</label><select name="age_range">${AGE_RANGES.map((v) => `<option ${r.age_range === v ? "selected" : ""}>${v}</option>`).join("")}</select></div><div class="field"><label>Gender</label><select name="gender_optional">${GENDERS.map((v) => `<option ${r.gender_optional === v ? "selected" : ""}>${v}</option>`).join("")}</select></div><div class="field"><label>Area</label><select name="location_zone_id">${zoneOptions(r.location_zone_id || "kralingen")}</select></div><div class="field"><label>Radius</label><select name="radius_km">${[1,2,5,10,20].map((v) => `<option value="${v}" ${Number(r.radius_km || 5) === v ? "selected" : ""}>${v} km</option>`).join("")}</select></div></div></div><div class="card stack"><div class="split"><h3>Hobby preferences</h3><button type="button" class="button secondary" data-action="toggle-interest-edit">Change hobby preferences</button></div><div class="pill-row ${state.settingsEditInterests ? "" : "hidden"}">${checkboxChoices("selected_interests", INTERESTS, selected)}</div><p class="muted small ${state.settingsEditInterests ? "hidden" : ""}">${selected.length ? selected.join(", ") : "No interests selected yet."}</p></div><div class="card stack"><h3>Notification preferences</h3><div class="pill-row">${checkboxChoices("notification_preferences", NOTIFICATIONS, Object.keys(notifications).filter((k) => notifications[k]))}</div></div><div class="card stack"><h3>Accessibility</h3><div class="pill-row">${checkboxChoices("accessibility_preferences", ["reducedMotion","highContrast","colorblind"], Object.keys(accessibility).filter((k) => accessibility[k] === true))}</div><div class="field"><label>Text scale</label><select name="fontScale">${[1,1.1,1.2,1.35].map((v) => `<option value="${v}" ${Number(accessibility.fontScale || 1) === v ? "selected" : ""}>${Math.round(v*100)}%</option>`).join("")}</select></div></div><div class="card stack"><h3>Privacy</h3><div class="pill-row">${checkboxChoices("privacy_settings", ["pauseRecs","hideFromMatching"], Object.keys(privacy).filter((k) => privacy[k] === true))}</div><p class="muted small">Pause recommendations keeps manual search working. Hide from matching excludes you from demand logic.</p></div><button class="button primary full-width" type="submit">Save settings</button></form><div class="card stack"><h3>Account</h3><button class="button danger" data-action="delete-data">Delete my data</button></div></section>`;
      }

      function renderOrganiserDashboard(mine) {
        const joins = mine.reduce((sum, e) => sum + Number(e.current_registration || 0), 0);
        return `<section class="stack"><div><p class="eyebrow">Verified organiser</p><h1>${escapeHtml(state.organiser?.name || "Organiser")}</h1></div><div class="grid three">${statCard("Events", mine.length)}${statCard("Sign-ups", joins)}${statCard("Open spots", mine.reduce((s,e) => s + spotsLeft(e), 0))}</div><div class="card stack"><h3>AI proposal</h3><p class="muted">High sports demand near Kralingen. Suggested: beginner-friendly activity with a welcome host.</p><button class="button primary" data-action="tab" data-tab="create">Create event</button></div></section>`;
      }
      function renderCreateEvent() {
        const zoneId = state.organiser?.municipality_zone_id || "kralingen";
        return `<section class="stack"><div><h1>Create</h1><p class="muted">Create a verified activity. Coordinates are resolved in the background.</p></div><form id="create-event-form" class="stack"><div class="card stack"><h3>Basics</h3><div class="field"><label>Title</label><input name="title" required placeholder="Beginner futsal night" /></div><div class="grid two"><div class="field"><label>Category</label><select name="category">${INTERESTS.map((v) => `<option>${v}</option>`).join("")}</select></div><div class="field"><label>Subcategory</label><input name="subcategory" placeholder="3v3 beginner game" /></div></div><div class="field"><label>Description</label><textarea name="description" required placeholder="A structured, low-pressure activity with a welcome host."></textarea></div></div><div class="card stack"><h3>Location</h3><div class="field"><label>Event location</label><input name="location_input" required placeholder="Search for a place or paste a Google Maps/OpenStreetMap link" /></div><div class="field"><label>Area</label><select name="zone_id">${zoneOptions(zoneId)}</select></div><p class="muted small">Raw latitude and longitude are saved invisibly after the location is resolved.</p></div><div class="card stack"><h3>Time and capacity</h3><div class="grid two"><div class="field"><label>Start time</label><input name="start_time" type="datetime-local" required value="${dateTimeLocal(1440)}" /></div><div class="field"><label>End time</label><input name="end_time" type="datetime-local" required value="${dateTimeLocal(1560)}" /></div><div class="field"><label>Minimum capacity</label><input name="min_capacity" type="number" min="1" value="4" required /></div><div class="field"><label>Maximum capacity</label><input name="max_capacity" type="number" min="1" value="12" required /></div></div></div><div class="card stack"><h3>Requirements</h3><div class="grid two"><div class="field"><label>Gender requirement</label><select name="gender_requirement_optional">${GENDERS.map((v) => `<option>${v}</option>`).join("")}</select></div><div class="field"><label>Skill level</label><select name="skill_level"><option>Any</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="field"><label>Team size</label><input name="team_size" type="number" min="1" value="3" /></div><div class="field"><label>Accessibility information</label><input name="accessibility_info" value="Step-free entry" /></div></div><div class="pill-row">${checkboxChoices("event_flags", ["beginner_friendly","people_usually_come_alone","welcome_host_present","team_based","spectators_allowed","bring_friend_allowed"], ["beginner_friendly","people_usually_come_alone","welcome_host_present","spectators_allowed","bring_friend_allowed"])}</div></div><button class="button primary full-width" type="submit">Create event</button></form></section>`;
      }
      function renderMyEvents(mine) { return `<section class="stack"><div><h1>My Events</h1><p class="muted">Only aggregate sign-up counts are shown.</p></div><div class="event-list">${mine.length ? mine.map(renderOrganiserEvent).join("") : emptyState("No organiser-created events yet.")}</div></section>`; }

      function renderEventCard(event) {
        const reg = registrationFor(event.id);
        const full = isFull(event);
        const left = spotsLeft(event);
        const match = matchScore(event);
        return `<article class="card event-card"><div class="event-title-row"><div class="event-icon">${escapeHtml((event.category || "E").slice(0,1))}</div><div style="flex:1"><div class="split"><h3>${escapeHtml(event.title)}</h3><span class="badge ${full ? "full" : left <= 3 ? "warning" : "soft"}">${full ? "Full" : left <= 3 ? "Almost full" : "Open"}</span></div><p class="muted">${escapeHtml(formatTime(event.start_time))} · ${escapeHtml(event.location_name || event.address || "Rotterdam")} · ${eventDistance(event).toFixed(1)}km</p></div></div><div class="pill-row"><span class="badge soft">${escapeHtml(event.category || "Event")}</span>${event.beginner_friendly ? `<span class="badge soft">Beginner-friendly</span>` : ""}<span class="badge soft">${full ? "Full" : `${left} spots left`}</span>${event.people_usually_come_alone ? `<span class="badge soft">Often solo</span>` : ""}${event.welcome_host_present ? `<span class="badge soft">Welcome host</span>` : ""}${event.organiser_verified ? `<span class="badge soft">Verified</span>` : ""}</div>${match > 0 ? `<p class="muted small">${escapeHtml(eventReason(event))}</p>` : `<p class="muted small">Other event you might explore.</p>`}${reg ? `<span class="badge">Saved: ${escapeHtml(reg.participation_state)}${reg.bring_friend ? " + friend" : ""}</span>` : ""}<div class="btn-row"><button class="button secondary" data-action="open-event" data-id="${escapeHtml(event.id)}">Details</button><button class="button primary" data-action="quick-join" data-id="${escapeHtml(event.id)}" ${full || reg?.participation_state === "Join" ? "disabled" : ""}>${reg?.participation_state === "Join" ? "Joined" : full ? "Full" : "Join"}</button></div></article>`;
      }
      function renderCompactEvent(event) { return `<article class="card stack"><div class="split"><strong>${escapeHtml(event.title)}</strong><span class="badge ${isFull(event) ? "full" : "soft"}">${statusLabel(event)}</span></div><p class="small muted">${escapeHtml(formatTime(event.start_time))} · ${escapeHtml(event.location_name || "Rotterdam")}</p><button class="button secondary" data-action="open-event" data-id="${escapeHtml(event.id)}">Details</button></article>`; }
      function renderOrganiserEvent(event) { return `<article class="card event-card"><div class="split"><div><span class="badge ${isFull(event) ? "full" : "soft"}">${statusLabel(event)}</span><h3 style="margin-top:8px">${escapeHtml(event.title)}</h3></div><strong>${Number(event.current_registration || 0)} / ${Number(event.max_capacity || 0)}</strong></div><p class="muted small">${escapeHtml(formatTime(event.start_time))} · ${escapeHtml(event.location_name || event.address || "Rotterdam")}</p><div class="btn-row"><button class="button secondary" data-action="view-counts" data-id="${escapeHtml(event.id)}">View sign-up count</button><button class="button secondary" data-action="open-event" data-id="${escapeHtml(event.id)}">Preview</button></div></article>`; }

      function renderEventModal() {
        const event = selectedEvent();
        if (!event) return "";
        const reg = registrationFor(event.id);
        const draft = state.detailDraft || { participation_state: reg?.participation_state || "", bring_friend: Boolean(reg?.bring_friend) };
        const full = isFull(event);
        const eligible = isEligible(event);
        return `<div class="modal-backdrop" data-action="close-event"><section class="modal" data-modal-body><header class="modal-header"><div><p class="eyebrow">Event details</p><h2>${escapeHtml(event.title)}</h2></div><button class="button secondary" data-action="close-event">Close</button></header><div class="modal-body stack"><div class="pill-row"><span class="badge ${full ? "full" : "soft"}">${statusLabel(event)}</span>${event.organiser_verified ? `<span class="badge soft">Verified organiser</span>` : ""}${event.welcome_host_present ? `<span class="badge soft">Welcome host</span>` : ""}${event.people_usually_come_alone ? `<span class="badge soft">People often come alone</span>` : ""}</div><p class="muted">${escapeHtml(event.description || "")}</p><div class="grid two">${detailItem("Time", formatTime(event.start_time))}${detailItem("Location", event.location_name || event.address || "Rotterdam")}${detailItem("Organiser", event.organiser_name || "Verified organiser")}${detailItem("Capacity", `${Number(event.current_registration || 0)} / ${Number(event.max_capacity || 0)}`)}${detailItem("Skill", event.skill_level || "Any")}${detailItem("Accessibility", event.accessibility_info || "Not specified")}</div>${event.recommendation_reason ? `<div class="notice small">${escapeHtml(event.recommendation_reason)}</div>` : ""}${!eligible ? `<div class="error-box">Your profile does not match this event's requirements.</div>` : ""}${state.role === "resident" ? `<div class="card stack"><h3>Participation</h3><div class="pill-row">${MAIN_STATES.map((s) => `<button class="button ${draft.participation_state === s ? "primary" : "secondary"}" data-action="select-state" data-state="${s}" ${s === "Join" && (full || !eligible || state.savingRegistration) ? "disabled" : ""}>${escapeHtml(s)}</button>`).join("")}</div><label class="choice"><input type="checkbox" data-action="toggle-friend" ${draft.bring_friend ? "checked" : ""} ${event.bring_friend_allowed ? "" : "disabled"} /><span>Bring a friend</span></label><div class="btn-row"><button class="button primary" data-action="save-registration" data-id="${escapeHtml(event.id)}" ${state.savingRegistration ? "disabled" : ""}>${state.savingRegistration ? "Saving..." : "Save status"}</button><a class="button secondary" target="_blank" rel="noreferrer" href="${osmLink(event)}">Open location</a></div>${draft.participation_state === "Join" ? renderArrival(event) : ""}</div>` : `<div class="card stack"><h3>Organiser preview</h3><p class="muted">Residents can save one participation state. Organisers see anonymised counts only.</p><button class="button secondary" data-action="view-counts" data-id="${escapeHtml(event.id)}">View sign-up count</button></div>`}</div></section></div>`;
      }
      function renderArrival(event) { return `<div class="notice small"><strong>Arrival Companion</strong><br>Address: ${escapeHtml(event.location_name || event.address || "Rotterdam")}<br>Bring: water bottle and comfortable shoes.<br>First 10 minutes: find the welcome host, warm up casually, and wait for team placement.<br>Team preview: You + 2 others if team-based.<br><button class="button secondary" style="margin-top:10px" data-action="im-here">I'm here</button></div>`; }
      function renderCountDialog() { const d = state.countDialog; if (!d) return ""; return `<div class="modal-backdrop" data-action="close-counts"><section class="modal" data-modal-body><header class="modal-header"><div><p class="eyebrow">Anonymised count</p><h2>${escapeHtml(d.title)}</h2></div><button class="button secondary" data-action="close-counts">Close</button></header><div class="modal-body stack"><div class="grid three">${statCard("Saved rows", d.total)}${statCard("Join", d.statuses.Join || 0)}${statCard("Bring friend", d.bringFriend || 0)}</div><div class="grid two">${MAIN_STATES.map((s) => statCard(s, d.statuses[s] || 0)).join("")}</div><p class="muted small">Resident names, emails, and public attendee lists are not shown.</p></div></section></div>`; }
      function renderDeleteConfirm() { if (!state.deleteConfirm) return ""; return `<div class="modal-backdrop" data-action="cancel-delete"><section class="modal" data-modal-body><header class="modal-header"><div><p class="eyebrow">Privacy</p><h2>Delete your data?</h2></div><button class="button secondary" data-action="cancel-delete">Cancel</button></header><div class="modal-body stack"><p class="muted">This prototype will deactivate your resident profile and remove you from personalised matching. Municipality dashboards keep only anonymous aggregate counts.</p><button class="button danger" data-action="confirm-delete">Delete my data</button></div></section></div>`; }

      function detailItem(label, value) { return `<div class="card"><p class="eyebrow">${escapeHtml(label)}</p><strong>${escapeHtml(value)}</strong></div>`; }
      function statCard(label, value) { return `<div class="card"><p class="eyebrow">${escapeHtml(label)}</p><h2>${escapeHtml(value)}</h2></div>`; }
      function emptyState(text) { return `<div class="empty">${escapeHtml(text)}</div>`; }
      function zoneOptions(selected) { return Object.entries(ZONES).map(([id, z]) => `<option value="${id}" ${selected === id ? "selected" : ""}>${escapeHtml(z.name)}</option>`).join(""); }
      function checkboxChoices(name, options, selected) { const s = new Set(selected); return options.map((v) => `<label class="choice"><input type="checkbox" name="${escapeHtml(name)}" value="${escapeHtml(v)}" ${s.has(v) ? "checked" : ""} /><span>${escapeHtml(labelFor(v))}</span></label>`).join(""); }
      function labelFor(value) { return { pauseRecs: "Pause recommendations", hideFromMatching: "Stop matching", reducedMotion: "Reduced motion", highContrast: "High contrast", colorblind: "Colorblind theme", beginner_friendly: "Beginner-friendly", people_usually_come_alone: "People often come alone", welcome_host_present: "Welcome host", team_based: "Team-based", spectators_allowed: "Spectators allowed", bring_friend_allowed: "Bring-a-friend allowed" }[value] || value; }

      function renderMap() {
        const node = document.querySelector("#map");
        if (!node) return;
        if (!window.L) { node.innerHTML = `<div class="empty">The map library could not load.</div>`; return; }
        removeMap();
        const center = getZone();
        mapInstance = window.L.map(node, { zoomControl: true }).setView([center.lat, center.lng], getRadiusKm() <= 2 ? 14 : 12);
        window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(mapInstance);
        radiusLayer = window.L.circle([center.lat, center.lng], { radius: getRadiusKm() * 1000, color: "#00d2c4", weight: 2, fillColor: "#00d2c4", fillOpacity: 0.07 }).addTo(mapInstance);
        markerLayer = window.L.layerGroup().addTo(mapInstance);
        visibleEvents().forEach((event) => {
          const marker = window.L.marker([Number(event.lat), Number(event.lng)], { icon: window.L.divIcon({ className: `event-pin ${isFull(event) ? "pin-full" : "pin-active"}`, html: "<span></span>", iconSize: [28, 36], iconAnchor: [14, 36] }), title: event.title });
          marker.on("click", () => openEvent(event.id));
          marker.addTo(markerLayer);
        });
        window.setTimeout(() => mapInstance?.invalidateSize(), 80);
      }
      function removeMap() { if (mapInstance) { mapInstance.remove(); mapInstance = null; markerLayer = null; radiusLayer = null; } }

      async function init() {
        const env = window.CIVIC_ROUTES_ENV || {};
        if (!env.VITE_SUPABASE_URL || !env.VITE_SUPABASE_PUBLISHABLE_KEY) { state.configError = MISSING_ENV_MESSAGE; render(); return; }
        try {
          const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
          state.supabase = createClient(env.VITE_SUPABASE_URL, env.VITE_SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
        } catch {
          state.configError = "The app could not load its browser dependencies. Refresh the page or check the network connection."; render(); return;
        }
        state.supabase.auth.onAuthStateChange((_event, session) => window.setTimeout(() => handleSession(session), 0));
        const { data, error } = await state.supabase.auth.getSession();
        if (error) { setError(error.message); return; }
        await handleSession(data.session);
      }
      async function handleSession(session) {
        state.session = session; state.user = session?.user || null; state.error = ""; state.notice = ""; state.selectedEventId = ""; state.detailDraft = null; state.countDialog = null;
        if (!session?.user) { state.role = ""; state.resident = null; state.organiser = null; state.events = []; state.registrations = []; state.tab = "map"; render(); return; }
        await loadProfile();
      }
      async function loadProfile() {
        const role = state.user?.user_metadata?.role === "organiser" ? "organiser" : "resident";
        state.role = role;
        if (role === "organiser") {
          const org = await loadProfileRow("organisers"); if (!org) return;
          state.organiser = org; state.resident = null;
          if (org.verification_status !== "verified") {
            const { data } = await state.supabase.from("organisers").update({ verification_status: "verified" }).eq("id", org.id).select("*").single(); if (data) state.organiser = data;
          }
          if (!["dashboard", "create", "my-events"].includes(state.tab)) state.tab = "dashboard";
          await fetchEvents(); render(); return;
        }
        const resident = await loadProfileRow("users"); if (!resident) return;
        state.resident = resident; state.organiser = null;
        if (!["events", "map", "settings"].includes(state.tab)) state.tab = "map";
        state.filters.zone ||= resident.location_zone_id || ""; state.filters.radius ||= String(resident.radius_km || "");
        await fetchEvents(); await fetchRegistrations(); render();
      }
      async function loadProfileRow(table) {
        for (let i = 0; i < 5; i++) {
          const { data, error } = await state.supabase.from(table).select("*").eq("auth_user_id", state.user.id).maybeSingle();
          if (error) { setError(error.message); return null; }
          if (data) return data;
          await new Promise((r) => setTimeout(r, 350));
        }
        setError("Profile row not found. Check that the Supabase signup trigger migration is applied."); return null;
      }
      async function fetchEvents() {
        if (!state.supabase || !state.session) return;
        const { data, error } = await state.supabase.from("events").select("*").in("status", ACTIVE_EVENT_STATUSES).order("start_time", { ascending: true });
        if (error) { state.events = []; setError(error.message); return; }
        state.events = data || [];
      }
      async function fetchRegistrations() {
        if (!state.resident) { state.registrations = []; return; }
        const { data, error } = await state.supabase.from("event_registrations").select("*").eq("user_id", state.resident.id);
        if (error) { setError(error.message); return; }
        state.registrations = data || [];
      }

      async function handleAuthSubmit(form) {
        const fd = new FormData(form); const email = String(fd.get("email") || "").trim(); const password = String(fd.get("password") || "");
        if (state.authMode === "signin") { const { error } = await state.supabase.auth.signInWithPassword({ email, password }); if (error) setError(error.message); return; }
        const role = String(fd.get("role") || "resident"); const name = String(fd.get("name") || "").trim();
        const metadata = role === "organiser" ? { role, name, type: "community_center", zone_id: "kralingen" } : { role, name, zone_id: "kralingen" };
        const { data, error } = await state.supabase.auth.signUp({ email, password, options: { data: metadata } });
        if (error) { setError(error.message); return; }
        if (!data.session) setNotice("Account created. Confirm your email, then sign in.");
      }
      async function handleOnboardingSubmit(form) {
        const fd = new FormData(form); const interests = fd.getAll("selected_interests"); if (!interests.length) { setError("Choose at least one interest before continuing."); return; }
        const notificationChoices = new Set(fd.getAll("notification_preferences"));
        const payload = { age_range: String(fd.get("age_range")), gender_optional: String(fd.get("gender_optional")), location_zone_id: String(fd.get("location_zone_id")), radius_km: Number(fd.get("radius_km")), selected_interests: interests, notification_preferences: Object.fromEntries(NOTIFICATIONS.map((k) => [k, notificationChoices.has(k)])), onboarding_complete: true };
        const { error } = await state.supabase.from("users").update(payload).eq("id", state.resident.id);
        if (error) { setError(error.message); return; }
        state.filters.zone = payload.location_zone_id; state.filters.radius = String(payload.radius_km); await loadProfile(); toast("Preferences saved. The map is ready.");
      }
      async function handleSettingsSubmit(form) {
        const fd = new FormData(form); const notificationChoices = new Set(fd.getAll("notification_preferences")); const accessibilityChoices = new Set(fd.getAll("accessibility_preferences")); const privacyChoices = new Set(fd.getAll("privacy_settings"));
        const payload = { age_range: String(fd.get("age_range")), gender_optional: String(fd.get("gender_optional")), location_zone_id: String(fd.get("location_zone_id")), radius_km: Number(fd.get("radius_km")), selected_interests: fd.getAll("selected_interests"), notification_preferences: Object.fromEntries(NOTIFICATIONS.map((k) => [k, notificationChoices.has(k)])), accessibility_preferences: { fontScale: Number(fd.get("fontScale") || 1), reducedMotion: accessibilityChoices.has("reducedMotion"), highContrast: accessibilityChoices.has("highContrast"), colorblind: accessibilityChoices.has("colorblind") }, privacy_settings: { pauseRecs: privacyChoices.has("pauseRecs"), hideFromMatching: privacyChoices.has("hideFromMatching"), deactivated: false } };
        const { error } = await state.supabase.from("users").update(payload).eq("id", state.resident.id);
        if (error) { setError(error.message); return; }
        state.filters.zone = payload.location_zone_id; state.filters.radius = String(payload.radius_km); await loadProfile(); toast("Settings saved.");
      }
      function extractCoords(input) {
        const text = String(input || "");
        let match = text.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/); if (match) return { lat: Number(match[1]), lng: Number(match[2]) };
        match = text.match(/[?&](?:q|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/); if (match) return { lat: Number(match[1]), lng: Number(match[2]) };
        const url = new URL(text, window.location.href); const mlat = url.searchParams.get("mlat"); const mlon = url.searchParams.get("mlon"); if (mlat && mlon) return { lat: Number(mlat), lng: Number(mlon) };
        match = text.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/); if (match) return { lat: Number(match[1]), lng: Number(match[2]) };
        return null;
      }
      async function resolveLocation(input, zoneId) {
        const trimmed = String(input || "").trim();
        if (/maps\.app\.goo\.gl|goo\.gl\/maps/.test(trimmed)) throw new Error("Could not read that short link. Please paste the full URL or type the address.");
        const coords = extractCoords(trimmed); if (coords) return { ...coords, name: trimmed.slice(0, 90) };
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=nl&q=${encodeURIComponent(`${trimmed} Rotterdam`)}`);
        const data = await response.json(); if (!data?.length) throw new Error("Could not find that location. Please use a clearer address or paste a map link.");
        return { lat: Number(data[0].lat), lng: Number(data[0].lon), name: data[0].display_name || trimmed };
      }
      async function handleCreateEventSubmit(form) {
        if (!state.organiser) return;
        const fd = new FormData(form); const flags = new Set(fd.getAll("event_flags")); const zoneId = String(fd.get("zone_id") || "kralingen");
        let location;
        try { location = await resolveLocation(String(fd.get("location_input") || ""), zoneId); } catch (error) { setError(error.message); return; }
        const category = String(fd.get("category") || "Sports"); const locationName = location.name.split(",")[0];
        const payload = { organiser_id: state.organiser.id, organiser_name: state.organiser.name, organiser_verified: true, title: String(fd.get("title") || "").trim(), category, subcategory: String(fd.get("subcategory") || "").trim(), icon: "pin", description: String(fd.get("description") || "").trim(), zone_id: zoneId, location_name: locationName, address: location.name, lat: location.lat, lng: location.lng, start_time: new Date(String(fd.get("start_time"))).toISOString(), end_time: new Date(String(fd.get("end_time"))).toISOString(), min_capacity: Number(fd.get("min_capacity") || 4), max_capacity: Number(fd.get("max_capacity") || 12), current_registration: 0, status: "scheduled", beginner_friendly: flags.has("beginner_friendly"), skill_level: String(fd.get("skill_level") || "Any"), age_range_min: 18, age_range_max: 99, gender_requirement_optional: String(fd.get("gender_requirement_optional") || "None") === "None" ? null : String(fd.get("gender_requirement_optional")), accessibility_info: String(fd.get("accessibility_info") || "Step-free entry"), equipment_needed: [], people_usually_come_alone: flags.has("people_usually_come_alone"), welcome_host_present: flags.has("welcome_host_present"), verified_organiser_required: true, team_based: flags.has("team_based"), team_size: flags.has("team_based") ? Number(fd.get("team_size") || 3) : null, spectators_allowed: flags.has("spectators_allowed"), bring_friend_allowed: flags.has("bring_friend_allowed"), recommendation_reason: `Recommended because this matches ${category}, ${getZone(zoneId).name}, beginner-friendly format, and open capacity.` };
        const { error } = await state.supabase.from("events").insert(payload);
        if (error) { setError(error.message); return; }
        await fetchEvents(); state.tab = "my-events"; setNotice("Event created.");
      }
      async function syncEventCount(eventId) {
        const { count, error } = await state.supabase.from("event_registrations").select("id", { count: "exact", head: true }).eq("event_id", eventId).eq("participation_state", "Join");
        if (error) return;
        const event = state.events.find((e) => e.id === eventId); const max = Number(event?.max_capacity || 0); const status = max && Number(count || 0) >= max ? "full" : event?.status === "full" ? "scheduled" : event?.status || "scheduled";
        await state.supabase.from("events").update({ current_registration: count || 0, status }).eq("id", eventId);
      }
      async function saveRegistration(statusOverride = "") {
        const event = selectedEvent(); if (!event || !state.resident) return;
        const status = statusOverride || state.detailDraft?.participation_state; if (!status) { setError("Choose one participation status before saving."); return; }
        if (status === "Join" && (isFull(event) || !isEligible(event))) { setError("This event is not joinable with your current profile."); return; }
        state.savingRegistration = true; render();
        const payload = { event_id: event.id, user_id: state.resident.id, participation_state: status, bring_friend: Boolean(state.detailDraft?.bring_friend) };
        const { error } = await state.supabase.from("event_registrations").upsert(payload, { onConflict: "event_id,user_id" });
        if (error) { state.savingRegistration = false; setError(error.message); return; }
        await syncEventCount(event.id); await fetchRegistrations(); await fetchEvents(); state.savingRegistration = false; toast(status === "Join" ? "You're in. Arrival help is ready." : "Your event choice was saved."); render();
      }
      async function viewCounts(eventId) {
        const event = state.events.find((item) => item.id === eventId); if (!event) return;
        const { data, error } = await state.supabase.from("event_registrations").select("participation_state, bring_friend").eq("event_id", eventId);
        if (error) { setError(error.message); return; }
        const statuses = {}; let bringFriend = 0; (data || []).forEach((row) => { statuses[row.participation_state] = (statuses[row.participation_state] || 0) + 1; if (row.bring_friend) bringFriend += 1; });
        state.countDialog = { title: event.title, total: data?.length || 0, statuses, bringFriend }; render();
      }
      async function safeDeleteData() {
        const privacy = asObject(state.resident?.privacy_settings, defaultPrivacySettings());
        await state.supabase.from("event_registrations").delete().eq("user_id", state.resident.id);
        await state.supabase.from("users").update({ selected_interests: [], onboarding_complete: false, privacy_settings: { ...privacy, deactivated: true, hideFromMatching: true, pauseRecs: true } }).eq("id", state.resident.id);
        state.deleteConfirm = false; await state.supabase.auth.signOut();
      }
      function openEvent(eventId) { const reg = registrationFor(eventId); state.selectedEventId = eventId; state.detailDraft = { participation_state: reg?.participation_state || "", bring_friend: Boolean(reg?.bring_friend) }; render(); }

      document.addEventListener("submit", async (event) => {
        if (event.target.matches("#auth-form")) { event.preventDefault(); await handleAuthSubmit(event.target); }
        if (event.target.matches("#onboarding-form")) { event.preventDefault(); await handleOnboardingSubmit(event.target); }
        if (event.target.matches("#settings-form")) { event.preventDefault(); await handleSettingsSubmit(event.target); }
        if (event.target.matches("#create-event-form")) { event.preventDefault(); await handleCreateEventSubmit(event.target); }
        if (event.target.matches("#filter-form")) { event.preventDefault(); const fd = new FormData(event.target); state.filters.query = String(fd.get("query") || ""); state.filters.zone = String(fd.get("zone") || state.filters.zone); state.filters.radius = String(fd.get("radius") || state.filters.radius); render(); }
      });
      document.addEventListener("change", (event) => {
        if (event.target.matches('input[name="role"]')) state.authRole = event.target.value;
        if (event.target.matches('[data-autosubmit="true"]')) { const form = event.target.closest("form"); const fd = new FormData(form); state.filters.query = String(fd.get("query") || ""); state.filters.zone = String(fd.get("zone") || ""); state.filters.radius = String(fd.get("radius") || ""); render(); }
      });
      document.addEventListener("click", async (event) => {
        const node = event.target.closest("[data-action]"); if (!node) return;
        const action = node.dataset.action;
        if ((action === "close-event" || action === "close-counts" || action === "cancel-delete") && node.classList.contains("modal-backdrop") && event.target.closest("[data-modal-body]")) return;
        event.preventDefault();
        if (action === "auth-mode") { state.authMode = node.dataset.mode; state.error = ""; state.notice = ""; render(); }
        if (action === "signout") await state.supabase.auth.signOut();
        if (action === "tab") { state.tab = node.dataset.tab; state.error = ""; state.notice = ""; render(); }
        if (action === "open-event") openEvent(node.dataset.id);
        if (action === "close-event") { state.selectedEventId = ""; state.detailDraft = null; render(); }
        if (action === "select-state") { state.detailDraft.participation_state = node.dataset.state; render(); }
        if (action === "toggle-friend") { if (!state.detailDraft) return; state.detailDraft.bring_friend = !state.detailDraft.bring_friend; render(); }
        if (action === "save-registration") await saveRegistration();
        if (action === "quick-join") { openEvent(node.dataset.id); state.detailDraft.participation_state = "Join"; await saveRegistration("Join"); }
        if (action === "view-counts") await viewCounts(node.dataset.id);
        if (action === "close-counts") { state.countDialog = null; render(); }
        if (action === "toggle-interest-edit") { state.settingsEditInterests = !state.settingsEditInterests; render(); }
        if (action === "delete-data") { state.deleteConfirm = true; render(); }
        if (action === "cancel-delete") { state.deleteConfirm = false; render(); }
        if (action === "confirm-delete") await safeDeleteData();
        if (action === "im-here") toast("Host notified in this prototype.");
      });

      init();
    </script>
  </body>
</html>
