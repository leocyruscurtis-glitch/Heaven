<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civic Routes</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>:root{--bg:#F4FBF7;--card:#fff;--ink:#0B4F37;--text:#374151;--muted:#66776f;--line:#dce9e2;--cta:#00a99d;--soft:#e9f8f2;--red:#EF4444;--shadow:0 8px 24px rgba(11,79,55,.08);--fs:100%}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);font-size:var(--fs)}body.high{--bg:#fff;--ink:#003b28;--text:#111827;--muted:#374151;--line:#6b7280;--soft:#e5f4ec}body.motion *{transition:none!important;animation:none!important}.app{min-height:100vh;display:grid;place-items:center;padding:18px}.phone{width:min(440px,100%);height:min(930px,calc(100vh - 36px));background:var(--card);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}.top{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.brand h1{margin:0;color:var(--ink);font-size:24px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:800}.screen{overflow:auto;padding:18px}.nav{display:grid;border-top:1px solid var(--line);background:#fff}.nav button{border:0;background:#fff;color:var(--muted);padding:12px 4px;font-weight:800;font-size:12px}.nav button.active{color:var(--ink);background:var(--soft)}h2{color:var(--ink);font-size:20px;margin:0 0 12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}.card h3{margin:0 0 6px;color:var(--ink);font-size:17px}.meta,.small{font-size:13px;color:var(--muted);line-height:1.45}.small{font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 10px;color:var(--ink);font-weight:750;font-size:12px}.chip.sel,.btn{background:var(--cta);color:white;border-color:var(--cta)}.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:900;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.ghost{background:#f3f6f5;color:#52635b}.row{display:flex;gap:8px;align-items:center}.field label{display:block;font-size:12px;color:var(--ink);font-weight:900;margin:10px 0 5px}.input,.select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;color:var(--text);font:inherit}textarea{min-height:86px}.mapShell{height:480px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#dff0e8;margin-bottom:14px}#map{height:100%;width:100%}.bar{display:grid;grid-template-columns:1fr 84px;gap:8px;margin-bottom:12px;position:relative}.suggest{position:absolute;top:50px;left:0;right:92px;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:999;overflow:hidden}.suggest button{display:block;width:100%;border:0;background:white;text-align:left;padding:12px;color:var(--text)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;place-items:center;padding:18px;z-index:2000}.modal.on{display:grid}.modal .box{width:min(430px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:18px}.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status button{border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px;font-weight:800;color:var(--ink)}.status button.sel{background:var(--cta);color:white}.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;margin:9px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.metric b{display:block;color:var(--ink);font-size:24px}.notice{border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:12px;color:var(--muted);font-size:13px;line-height:1.45}a{color:var(--cta)}.marker-dot{width:24px;height:24px;border-radius:50%;background:var(--cta);border:3px solid white;box-shadow:0 4px 12px rgba(0,0,0,.25);display:grid;place-items:center;color:white;font-weight:900;font-size:12px}.marker-dot.full{background:#9ca3af;text-decoration:line-through}.danger{color:#b91c1c}.divider{height:1px;background:var(--line);margin:14px 0}</style></head><body><div class="app"><div class="phone"><header class="top"><div class="brand"><h1>Civic Routes</h1><p id="sub">Low-pressure local activities in Rotterdam</p></div><span class="pill" id="rolePill">Guest</span></header><main class="screen" id="screen"></main><nav class="nav" id="nav"></nav></div></div><div class="modal" id="modal"><div class="box" id="modalBox"></div></div><script>
const $=s=>document.querySelector(s),screen=$('#screen'),navEl=$('#nav'),modal=$('#modal'),box=$('#modalBox');
const baseEvents=[{id:'e1',title:'Beginner 3v3 Basketball Run',cat:'Sports',lat:51.9296,lng:4.5168,time:'Today 18:30',loc:'Kralingse Plaslaan Court',max:12,cur:6,skill:'Beginner',req:'Age 18+, beginner friendly',org:'Rotterdam Sport',reason:'sports, beginner level, evenings and selected radius'},{id:'e2',title:'Quiet Reading Circle',cat:'Reading',lat:51.9201,lng:4.4898,time:'Sat 11:00',loc:'Library Blaak',max:10,cur:3,skill:'Calm',req:'Age 18+, quiet format',org:'Bibliotheek Rotterdam',reason:'reading, quiet activities and small groups'},{id:'e3',title:'Community Dinner Table',cat:'Cooking',lat:51.9102,lng:4.4471,time:'Tomorrow 19:00',loc:'Delfshaven Community Kitchen',max:16,cur:13,skill:'All levels',req:'Age 18+, all skill levels',org:'Delfshaven Kitchen',reason:'cooking and low-pressure structured events'},{id:'e4',title:'Board Game Night',cat:'Gaming',lat:51.9358,lng:4.4782,time:'Fri 20:00',loc:'Noord Community Centre',max:20,cur:20,skill:'Beginner',req:'Age 18+',org:'Noord Community Centre',reason:'board games and weekend events'},{id:'e5',title:'Walking Group by the Lake',cat:'Walking',lat:51.9344,lng:4.5261,time:'Sun 10:00',loc:'Kralingse Plas',max:18,cur:7,skill:'Easy',req:'Age 18+, easy pace',org:'Rotterdam Groen',reason:'walking and nearby outdoor events'}];
let state=JSON.parse(localStorage.civicState||'{}');state={tab:'login',role:null,userId:state.userId||('CR-'+Math.random().toString(36).slice(2,8).toUpperCase()),orgId:state.orgId||('ORG-'+Math.random().toString(36).slice(2,8).toUpperCase()),center:state.center||{lat:51.931,lng:4.518},radius:state.radius||5,hobbies:state.hobbies||['Sports','Reading'],statuses:state.statuses||{},bring:state.bring||{},created:state.created||[],pause:false,hide:false,fs:100,...state};
const zones={Kralingen:{lat:51.931,lng:4.518},Centrum:{lat:51.922,lng:4.479},Noord:{lat:51.938,lng:4.477},Delfshaven:{lat:51.909,lng:4.446},Zuid:{lat:51.895,lng:4.495},Crooswijk:{lat:51.929,lng:4.492}};let map;
function allEvents(){return [...baseEvents,...state.created]}function save(){localStorage.civicState=JSON.stringify(state);document.body.style.setProperty('--fs',state.fs+'%');document.body.classList.toggle('motion',!!state.reduce);document.body.classList.toggle('high',!!state.high);$('#rolePill').textContent=state.role==='organiser'?'Verified organiser · '+state.orgId:state.role==='resident'?'Resident · '+state.userId:'Guest'}
function distKm(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,s1=Math.sin(dLat/2),s2=Math.sin(dLng/2);return 2*R*Math.asin(Math.sqrt(s1*s1+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*s2*s2))}function filtered(){return allEvents().filter(e=>distKm(state.center,e)<=state.radius).sort((a,b)=>(state.hobbies.includes(b.cat)-state.hobbies.includes(a.cat))||(a.cur/a.max-b.cur/b.max))}
function open(html){box.innerHTML=html;modal.classList.add('on')}modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')};function nav(t){state.tab=t;save();render()}
function renderNav(){if(!state.role){navEl.innerHTML='';return}const items=state.role==='organiser'?[['organiser','Dashboard'],['create','Create'],['orgEvents','My events']]:[['events','Events'],['map','Map'],['settings','Settings']];navEl.style.gridTemplateColumns=`repeat(${items.length},1fr)`;navEl.innerHTML=items.map(([t,l])=>`<button class="${state.tab===t?'active':''}" onclick="nav('${t}')">${l}</button>`).join('')}
function login(){screen.innerHTML=`<h2>Choose account type</h2><div class="notice">Residents and verified organisers have separate interfaces. Residents can discover and join events. Organisers can create events and view sign-up counts.</div><button class="btn" style="width:100%;margin:10px 0" onclick="state.role='resident';state.tab='map';save();render()">Continue as resident</button><button class="btn secondary" style="width:100%" onclick="state.role='organiser';state.tab='organiser';save();render()">Sign up as verified organiser</button>`}
function card(e){let full=e.cur>=e.max,st=state.statuses[e.id];return `<div class="card"><h3>${e.title}</h3><p class="meta">${e.time} · <a target="_blank" rel="noopener noreferrer" href="https://www.openstreetmap.org/?mlat=${e.lat}&mlon=${e.lng}#map=17/${e.lat}/${e.lng}">${e.loc}</a> · ${e.max-e.cur} open spots</p><div class="chips"><span class="chip">${e.cat}</span><span class="chip">${e.skill}</span><span class="chip">Verified organiser</span></div><p class="small">${state.pause?'Recommendations are paused. You can still search manually.':'Recommended because you selected '+e.reason+'.'}</p><div class="row"><button class="btn secondary" onclick="details('${e.id}')">Learn More</button><button class="btn" ${full?'disabled':''} onclick="join('${e.id}')">${full?'Full':st||'Join'}</button></div></div>`}
function mapTab(){let fs=filtered();screen.innerHTML=`<h2>OpenStreetMap event map</h2><div class="bar"><input class="input" id="searchBox" placeholder="Search Rotterdam area" oninput="searchPlaces(this.value)"><select class="select" onchange="state.radius=+this.value;save();render()"><option value="1" ${state.radius==1?'selected':''}>1 km</option><option value="2" ${state.radius==2?'selected':''}>2 km</option><option value="5" ${state.radius==5?'selected':''}>5 km</option><option value="10" ${state.radius==10?'selected':''}>10 km</option><option value="20" ${state.radius==20?'selected':''}>20 km</option></select><div id="suggest" class="suggest hidden"></div></div><div class="mapShell"><div id="map"></div></div><p class="small">Pins only. Full events are grey; available events are active.</p><h2>Nearby activities</h2>${fs.map(card).join('')||'<div class="notice">No events inside this radius yet.</div>'}`;setTimeout(drawMap,0)}
function drawMap(){if(!$('#map'))return;map=L.map('map').setView([state.center.lat,state.center.lng],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);L.circle([state.center.lat,state.center.lng],{radius:state.radius*1000,color:'#EF4444',weight:2,fillColor:'#EF4444',fillOpacity:.06}).addTo(map);filtered().forEach(e=>{let full=e.cur>=e.max,icon=L.divIcon({className:'',html:`<div class="marker-dot ${full?'full':''}">${e.cat[0]}</div>`,iconSize:[30,30],iconAnchor:[15,15]});L.marker([e.lat,e.lng],{icon}).addTo(map).on('click',()=>details(e.id))});setTimeout(()=>map.invalidateSize(),150)}
let searchTimer;async function searchPlaces(q){const d=$('#suggest');clearTimeout(searchTimer);if(!q||q.length<2){d.classList.add('hidden');return}searchTimer=setTimeout(async()=>{let local=Object.keys(zones).filter(z=>z.toLowerCase().includes(q.toLowerCase())).map(z=>({display_name:z+', Rotterdam',lat:zones[z].lat,lon:zones[z].lng}));let remote=[];try{remote=await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=4&countrycodes=nl&q=${encodeURIComponent(q+' Rotterdam')}`)).json()}catch(e){}let hits=[...local,...remote].slice(0,6);d.innerHTML=hits.map(h=>`<button onclick="pickPlace(${h.lat},${h.lon},'${String(h.display_name).replace(/'/g,'')}')">${h.display_name}</button>`).join('');d.classList.toggle('hidden',!hits.length)},250)}function pickPlace(lat,lng,name){state.center={lat:+lat,lng:+lng};state.zone=name.split(',')[0];save();render()}
function details(id){let e=allEvents().find(x=>x.id===id),st=state.statuses[id]||'None';open(`<h2>${e.title}</h2><p class="meta">${e.time} · <a target="_blank" rel="noopener noreferrer" href="https://www.openstreetmap.org/?mlat=${e.lat}&mlon=${e.lng}#map=17/${e.lat}/${e.lng}">${e.loc}</a></p><div class="chips"><span class="chip">${e.cat}</span><span class="chip">${e.skill}</span><span class="chip">${e.max-e.cur} open spots</span><span class="chip">${e.org}</span></div><p><b>Requirements:</b> ${e.req}</p><p>${state.pause?'Recommendations are paused. You can still search manually.':'Recommended because you selected '+e.reason+'.'}</p><h3>Participation</h3><div class="status">${['Spectator','Join','Interested','Maybe','Remind me later'].map(s=>`<button class="${st==s?'sel':''}" onclick="setStatus('${id}','${s}')">${s}</button>`).join('')}<button class="${state.bring[id]?'sel':''}" onclick="state.bring['${id}']=!state.bring['${id}'];save();details('${id}')">Bring a friend</button></div><div class="row" style="margin-top:14px"><button class="btn secondary" onclick="modal.classList.remove('on');state.tab='events';render()">Back to events</button><button class="btn" onclick="arrival('${id}')">Arrival Companion</button></div>`)}
function setStatus(id,s){state.statuses[id]=s;let e=state.created.find(x=>x.id===id)||baseEvents.find(x=>x.id===id);if(s==='Join'&&!state.joined?.[id]){state.joined={...(state.joined||{}),[id]:true};e.cur=Math.min(e.max,e.cur+1)}save();details(id)}function join(id){setStatus(id,'Join');arrival(id)}function arrival(id){let e=allEvents().find(x=>x.id===id);open(`<h2>Arrival Companion</h2><div class="card"><p><b>Exact location:</b> ${e.loc}</p><p><b>Coordinates:</b> ${e.lat}, ${e.lng}</p><p><b>Bring:</b> Water bottle and comfortable shoes.</p><p><b>First 10 minutes:</b> find the welcome sign, meet the host, warm up casually, teams are assigned automatically.</p><button class="btn" onclick="alert('Host notified in prototype')">I'm here</button></div><h3>Team placement preview</h3><div class="card">Team A: You + 2 others<br>Team B: 3 participants<br>Team C: 3 participants</div>`)}
function eventsTab(){let fs=filtered();screen.innerHTML=`<h2>Events</h2><input class="input" placeholder="Search location or hobby"><p class="small">Recommended events are sorted by relevance, distance, availability and timing. All available events remain reachable.</p>${state.pause?'<div class="notice">Recommendations are paused. You can still search events manually.</div>':''}${fs.map(card).join('')}`}
function settings(){let hs=['Sports','Reading','Music','Gaming','Cooking','Walking','Literature','Board Games','Arts & Crafts'];screen.innerHTML=`<h2>Settings</h2><div class="card"><h3>Hobby Preferences</h3><p class="meta">Update the activities used for recommendations.</p><div class="chips">${hs.map(h=>`<button class="chip ${state.hobbies.includes(h)?'sel':''}" onclick="toggleHobby('${h}')">${h}</button>`).join('')}</div></div><div class="card"><h3>Accessibility</h3><label class="toggle">Reduce motion <input type="checkbox" ${state.reduce?'checked':''} onchange="state.reduce=this.checked;save()"></label><label class="toggle">High contrast <input type="checkbox" ${state.high?'checked':''} onchange="state.high=this.checked;save()"></label><label>Font size: <span id="fs">${state.fs}%</span></label><input class="input" type="range" min="100" max="140" step="10" value="${state.fs}" oninput="state.fs=this.value;save();$('#fs').textContent=this.value+'%'" /></div><div class="card"><h3>Privacy controls</h3><label class="toggle">Pause recommendations <input type="checkbox" ${state.pause?'checked':''} onchange="state.pause=this.checked;save();render()"></label><label class="toggle">Hide me from matching <input type="checkbox" ${state.hide?'checked':''} onchange="state.hide=this.checked;save();render()"></label><button class="btn ghost" onclick="deleteData()">Delete my data</button></div><button class="btn ghost" style="width:100%" onclick="state.role=null;state.tab='login';save();render()">Switch account type</button>`}
function toggleHobby(h){state.hobbies=state.hobbies.includes(h)?state.hobbies.filter(x=>x!==h):[...state.hobbies,h];save();settings()}function deleteData(){if(confirm('Delete your data?')){localStorage.removeItem('civicState');location.reload()}}
function organiser(){let mine=state.created;screen.innerHTML=`<h2>Verified organiser dashboard</h2><div class="notice">You are signed in as a verified organiser. This interface is separate from the resident app. Organisers create events, review requirements and monitor sign-ups.</div><div class="metrics"><div class="metric"><b>${mine.length}</b><span>events created</span></div><div class="metric"><b>${mine.reduce((s,e)=>s+e.cur,0)}</b><span>current sign-ups</span></div><div class="metric"><b>Verified</b><span>organiser status</span></div><div class="metric"><b>0</b><span>individual public profiles</span></div></div><h2 style="margin-top:16px">AI event proposal</h2><div class="card"><h3>Beginner 3v3 Street Run</h3><p class="meta">Detected high basketball interest near Kralingen. 14 residents selected sports within this radius. Suggested time: 18:30.</p><div class="row"><button class="btn" onclick="state.tab='create';render()">Use proposal</button><button class="btn secondary">Edit</button><button class="btn ghost">Reject</button></div></div>`}
function create(){screen.innerHTML=`<h2>Create event</h2><div class="notice">Only verified organisers can publish public events. Created events appear in the resident map and events feed.</div><div class="card"><div class="field"><label>Event title</label><input id="t" class="input" value="Beginner futsal night"></div><div class="field"><label>Category</label><select id="cat" class="select"><option>Sports</option><option>Reading</option><option>Cooking</option><option>Gaming</option><option>Walking</option></select></div><div class="field"><label>Location</label><input id="loc" class="input" value="Erasmus Sport Centre"></div><div class="grid2"><div class="field"><label>Latitude</label><input id="lat" class="input" value="51.9182"></div><div class="field"><label>Longitude</label><input id="lng" class="input" value="4.5250"></div></div><div class="field"><label>Date/time</label><input id="time" class="input" value="Today 19:00"></div><div class="grid2"><div class="field"><label>Max participants</label><input id="max" class="input" type="number" value="12"></div><div class="field"><label>Current sign-ups</label><input id="cur" class="input" type="number" value="0"></div></div><div class="field"><label>Requirements</label><textarea id="req">Age 18+, beginner friendly, welcome host present</textarea></div><button class="btn" style="width:100%" onclick="createEvent()">Create and publish event</button></div>`}
function createEvent(){let e={id:'c'+Date.now(),title:$('#t').value,cat:$('#cat').value,lat:+$('#lat').value,lng:+$('#lng').value,time:$('#time').value,loc:$('#loc').value,max:+$('#max').value,cur:+$('#cur').value,skill:'Beginner',req:$('#req').value,org:'Verified organiser '+state.orgId,reason:'your selected interests, location and open capacity'};state.created.push(e);save();alert('Event created and published to resident map');state.tab='orgEvents';render()}
function orgEvents(){let mine=state.created;screen.innerHTML=`<h2>My organiser events</h2>${mine.length?mine.map(e=>`<div class="card"><h3>${e.title}</h3><p class="meta">${e.time} · ${e.loc}</p><div class="chips"><span class="chip">${e.cat}</span><span class="chip">${e.cur}/${e.max} signed up</span><span class="chip">${e.req}</span></div><button class="btn secondary" onclick="alert('Prototype participant list: ${e.cur} residents signed up. Individual profiles are not public.')">View sign-up count</button></div>`).join(''):'<div class="notice">No organiser events yet. Create one first.</div>'}`}
function render(){save();renderNav();if(!state.role)return login();if(state.role==='resident'&&!['events','map','settings'].includes(state.tab))state.tab='map';if(state.role==='organiser'&&!['organiser','create','orgEvents'].includes(state.tab))state.tab='organiser';({map:mapTab,events:eventsTab,settings,organiser,create,orgEvents,login}[state.tab]||login)()}render();
</script></body></html>
